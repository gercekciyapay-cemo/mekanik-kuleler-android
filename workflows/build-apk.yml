name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # Actions sekmesinden elle de başlatılabilir

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Three.js dosyalarını www/lib içine kopyala
        run: npm run libs

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Web dosyalarını Android'e aktar
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: mekanik-kuleler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
